<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIS 457 - Grup Projesi (3. Hafta)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Proje Yönetim ve Etkinlik Portalı</h1>
    </header>

    <main class="container">
        <!-- Kayıt / Veri Oluşturma Formu -->
        <section class="form-section">
            <h2>Yeni Etkinlik / Kayıt Ekle</h2>
            <form id="projectForm" novalidate>
                <div class="form-group">
                    <label for="title">Başlık / Etkinlik Adı:</label>
                    <input type="text" id="title" name="title" placeholder="Örn: Web Geliştirme Atölyesi">
                    <span class="error-message" id="titleError"></span>
                </div>

                <div class="form-group">
                    <label for="category">Kategori:</label>
                    <select id="category" name="category">
                        <option value="">Kategori Seçin</option>
                        <option value="Yazılım">Yazılım</option>
                        <option value="Tasarım">Tasarım</option>
                        <option value="Yönetim">Yönetim</option>
                    </select>
                    <span class="error-message" id="categoryError"></span>
                </div>

                <div class="form-group">
                    <label for="description">Açıklama (En az 10 karakter):</label>
                    <textarea id="description" name="description" rows="3" placeholder="Etkinlik hakkında detay verin..."></textarea>
                    <span class="error-message" id="descriptionError"></span>
                </div>

                <button type="submit" id="submitBtn">Kaydet ve Listeye Ekle</button>
            </form>
        </section>

        <!-- JS Dizisinden Dinamik Oluşturulacak Liste -->
        <section class="list-section">
            <h2>Mevcut Kayıtlar</h2>
            <div id="dataList" class="cards-grid">
                <!-- JavaScript app.js tarafından dinamik doldurulacak -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
